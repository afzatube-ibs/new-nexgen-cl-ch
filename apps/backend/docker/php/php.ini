; neXgen Core — runtime PHP configuration
; Secure-by-default per SECURITY:SECURE_CONFIGURATION: an operator who never
; touches this file still gets a safe posture out of the box.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; File upload limits — SECURITY:FILE_UPLOAD is enforced at the Media module's
; application layer; these are the outer platform-level bounds.
upload_max_filesize = 20M
post_max_size = 20M
max_file_uploads = 20

memory_limit = 256M
max_execution_time = 60

; Session state must never live in the Application Unit's local filesystem —
; ARCH:NFR statelessness / ADR-0004 externalizes sessions to Redis. This is
; enforced again at the Laravel config layer (config/session.php); this line
; simply ensures no code path can silently fall back to local files.
session.save_handler = redis
