; OPcache — enabled by default for production-grade performance
; (ENGINEERING:PERFORMANCE_ENGINEERING). validate_timestamps is left on so a
; deployed code change is picked up without requiring a manual cache flush,
; consistent with DEPLOYMENT:PHILOSOPHY's "upgrades are routine, not feared."

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M
