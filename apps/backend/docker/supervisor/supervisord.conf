; Supervises php-fpm inside the Application Unit container only. Background
; Workers run as a separate container/process (docker-compose.yml `worker`
; service, `php artisan queue:work`) — supervisor here is deliberately
; scoped to a single program, not a general-purpose multi-process init
; system, because collapsing the Application Unit and the Background Worker
; into one container would violate ARCH:DEPLOYMENT_TOPOLOGY's requirement
; that the two be independently, horizontally scalable.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
