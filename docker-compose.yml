# neXgen Core — self-hosted deployment topology.
#
# Implements ARCH:DEPLOYMENT_TOPOLOGY exactly: an Application Unit (nginx +
# app), one or more Background Workers, a Cache/Session/Queue store (Redis,
# ADR-0004), and a Primary Datastore (MySQL, ADR-0003) — packaged with
# Docker per ADR-0008, no orchestration platform assumed.
#
# `app` and `worker` are stateless and independently scalable:
#   docker compose up --scale app=3 --scale worker=2
# is a valid, supported way to run this file — this is the concrete,
# exercisable demonstration of ARCH:NFR's horizontal-scalability principle
# for Platform Foundation's acceptance criteria.

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/backend/public:/var/www/html/public:ro
    networks:
      - nexgen

  app:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: ["php-fpm"]
    env_file:
      - ./apps/backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/var/www/html:delegated
      - backend_vendor:/var/www/html/vendor
    networks:
      - nexgen
    healthcheck:
      test: ["CMD", "php", "artisan", "platform:health", "--liveness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: ["worker"]
    env_file:
      - ./apps/backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/var/www/html:delegated
      - backend_vendor:/var/www/html/vendor
    networks:
      - nexgen
    # A worker has no HTTP surface, so readiness is judged by the queue
    # connection it depends on, per ARCH:NFR's fault-tolerance principle —
    # not by an artificial HTTP probe bolted on only to satisfy tooling.
    healthcheck:
      test: ["CMD", "php", "artisan", "platform:health", "--liveness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nexgen}
      MYSQL_USER: ${DB_USERNAME:-nexgen}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set — no insecure default, per SECURITY:SECURE_CONFIGURATION}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set — no insecure default, per SECURITY:SECURE_CONFIGURATION}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nexgen
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set — no insecure default, per SECURITY:SECURE_CONFIGURATION}"]
    volumes:
      - redis_data:/data
    networks:
      - nexgen
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  nexgen:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  backend_vendor:
