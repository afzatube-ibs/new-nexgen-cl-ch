name: gate4-lock-refresh

on:
  push:
    branches:
      - nexgen-gate4-security-hardening
    paths:
      - '.github/workflows/gate4-lock-refresh.yml'
      - 'package.json'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
      - 'apps/backend/composer.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Gate 4 branch
        uses: actions/checkout@v4
        with:
          ref: nexgen-gate4-security-hardening
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate npm lockfile with npm 11
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npx --yes npm@11 install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify generated lock with runtime npm 10
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          test "$(npm --version | cut -d. -f1)" = "10"
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Refresh patched CommonMark lock entry
        working-directory: apps/backend
        run: composer update league/commonmark --with-all-dependencies --no-interaction --no-scripts --no-progress

      - name: Verify resolved security floors
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const lock = require('./package-lock.json');
          const checks = {
            'node_modules/next': '15.5.24',
            'node_modules/fastify': '5.12.1',
            'node_modules/vite': '6.4.3',
            'node_modules/vitest': '4.1.11',
            'node_modules/@fastify/swagger-ui': '6.1.1',
            'node_modules/@vitejs/plugin-react': '4.4.1',
          };
          for (const [key, floor] of Object.entries(checks)) {
            const version = lock.packages?.[key]?.version;
            if (!version) throw new Error(`Missing ${key} in package-lock.json`);
            const a = version.split('.').map(Number);
            const b = floor.split('.').map(Number);
            const below = a[0] < b[0] || (a[0] === b[0] && (a[1] < b[1] || (a[1] === b[1] && a[2] < b[2])));
            if (below) throw new Error(`${key} resolved to ${version}, below security floor ${floor}`);
            console.log(`${key}=${version}`);
          }
          NODE

          php -r '
            $lock=json_decode(file_get_contents("apps/backend/composer.lock"), true);
            $version=null;
            foreach ($lock["packages"] as $p) if ($p["name"] === "league/commonmark") $version=ltrim($p["version"], "v");
            if ($version === null || version_compare($version, "2.10.0", "<")) { fwrite(STDERR, "league/commonmark security floor not met\n"); exit(1); }
            echo "league/commonmark=$version\n";
          '

      - name: Commit regenerated locks
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json apps/backend/composer.lock; then
            echo 'Lockfiles already satisfy requested constraints.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json apps/backend/composer.lock
          git commit -m 'security(deps): regenerate patched dependency locks'
          git push origin HEAD:nexgen-gate4-security-hardening
