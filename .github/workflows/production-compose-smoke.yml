name: production-compose-smoke

on:
  pull_request:
    paths:
      - 'docker-compose.production.yml'
      - 'docker/**'
      - '.dockerignore'
      - '.env.production.example'
      - 'apps/backend/**'
      - 'apps/store-api-gateway/**'
      - 'apps/storefront/**'
      - 'apps/admin/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/production-compose-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare disposable production configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .env.production.example .env.production

          APP_KEY="base64:$(openssl rand -base64 32 | tr -d '\n')"
          cat >> .env.production <<EOF

          # CI overrides — disposable, local-only values.
          APP_KEY=${APP_KEY}
          BACKEND_PUBLIC_URL=http://127.0.0.1:8080
          GATEWAY_PUBLIC_URL=http://127.0.0.1:4000
          STOREFRONT_PUBLIC_URL=http://127.0.0.1:3000
          ADMIN_PUBLIC_URL=http://127.0.0.1:8081
          BACKEND_CORS_ALLOWED_ORIGINS=http://127.0.0.1:8081,http://127.0.0.1:3000
          DB_PASSWORD=ci-db-password-7c12c1c2
          DB_ROOT_PASSWORD=ci-root-password-92e7d4f1
          REDIS_PASSWORD=ci-redis-password-52af3a91
          GATEWAY_REDIS_URL=redis://:ci-redis-password-52af3a91@redis:6379
          GUEST_SESSION_SECRET=ci-guest-session-secret-1234567890-abcdef
          PREVIEW_TOKEN_SECRET=ci-preview-token-secret-1234567890-abcdef
          PAYMENTS_CHECKOUT_RETURN_URL=http://127.0.0.1:3000/checkout/success
          BACKEND_SERVICE_TOKEN=
          BACKEND_CHECKOUT_SERVICE_TOKEN=
          EOF

          docker compose --env-file .env.production -f docker-compose.production.yml config --quiet

      - name: Build production images
        env:
          COMPOSE_PARALLEL_LIMIT: 2
        run: |
          docker compose --env-file .env.production -f docker-compose.production.yml build \
            backend-nginx app gateway admin storefront

      - name: Gateway refuses unprovisioned bootstrap credentials
        shell: bash
        run: |
          set -euo pipefail
          if docker compose --env-file .env.production -f docker-compose.production.yml \
            run --rm --no-deps gateway; then
            echo 'Gateway unexpectedly started with bootstrap token placeholders.' >&2
            exit 1
          fi

      - name: Start bootstrap services
        run: |
          docker compose --env-file .env.production -f docker-compose.production.yml up -d --wait \
            mysql redis app backend-nginx

      - name: Initialize fresh production database
        run: |
          set -euo pipefail
          COMPOSE='docker compose --env-file .env.production -f docker-compose.production.yml'
          $COMPOSE exec -T app php artisan migrate:fresh --seed --force
          $COMPOSE exec -T app php artisan identity-access:create-admin \
            --name='Production Smoke Admin' \
            --email='admin@nexgen.local' \
            --password='Smoke!Pass1234'

      - name: Provision least-privilege Gateway credentials
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE='docker compose --env-file .env.production -f docker-compose.production.yml'

          STORE_TOKEN="$($COMPOSE exec -T app php artisan identity-access:create-service-account storefront-service --token-only)"
          CHECKOUT_TOKEN="$($COMPOSE exec -T app php artisan identity-access:create-service-account checkout-service --token-only)"
          [[ "$STORE_TOKEN" =~ ^[0-9]+\|[^[:space:]]+$ ]]
          [[ "$CHECKOUT_TOKEN" =~ ^[0-9]+\|[^[:space:]]+$ ]]

          export STORE_TOKEN CHECKOUT_TOKEN
          python3 <<'PY'
          from pathlib import Path
          import os

          path = Path('.env.production')
          lines = path.read_text().splitlines()
          replacements = {
              'BACKEND_SERVICE_TOKEN': os.environ['STORE_TOKEN'],
              'BACKEND_CHECKOUT_SERVICE_TOKEN': os.environ['CHECKOUT_TOKEN'],
          }
          seen = set()
          out = []
          for line in lines:
              key = line.split('=', 1)[0] if '=' in line else None
              if key in replacements:
                  if key in seen:
                      continue
                  out.append(f'{key}={replacements[key]}')
                  seen.add(key)
              else:
                  out.append(line)
          for key, value in replacements.items():
              if key not in seen:
                  out.append(f'{key}={value}')
          path.write_text('\n'.join(out) + '\n')
          PY

          # Never print either token. Only verify Compose can resolve the
          # updated model with the real disposable credentials present.
          docker compose --env-file .env.production -f docker-compose.production.yml config --quiet

      - name: Start complete production topology
        run: |
          docker compose --env-file .env.production -f docker-compose.production.yml up -d --wait

      - name: Verify production HTTP surfaces and real integration
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:4000/health
          curl -fsS http://127.0.0.1:4000/v1/branding > /tmp/production-branding.json
          curl -fsS -o /dev/null -w 'storefront=%{http_code}\n' http://127.0.0.1:3000/
          curl -fsS http://127.0.0.1:8081/healthz
          curl -fsS -o /dev/null -w 'admin_login=%{http_code}\n' http://127.0.0.1:8081/login

          docker compose --env-file .env.production -f docker-compose.production.yml exec -T app \
            php artisan platform:health

      - name: Capture deployment evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/nexgen-production-smoke
          docker compose --env-file .env.production -f docker-compose.production.yml ps -a \
            > /tmp/nexgen-production-smoke/compose-ps.txt 2>&1 || true
          docker compose --env-file .env.production -f docker-compose.production.yml logs --no-color \
            > /tmp/nexgen-production-smoke/compose.log 2>&1 || true
          if [ -f /tmp/production-branding.json ]; then
            cp /tmp/production-branding.json /tmp/nexgen-production-smoke/branding.json
          fi

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexgen-production-compose-smoke-${{ github.sha }}
          path: /tmp/nexgen-production-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down disposable stack
        if: always()
        run: |
          docker compose --env-file .env.production -f docker-compose.production.yml down -v --remove-orphans || true
