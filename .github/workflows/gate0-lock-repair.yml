name: gate0-lock-repair

on:
  push:
    branches:
      - nexgen-v1-production

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate optional dependency metadata
        run: |
          rm -rf node_modules
          npm install --package-lock-only --ignore-scripts
      - name: Verify Linux Rollup package is locked
        run: grep -q 'node_modules/@rollup/rollup-linux-x64-gnu' package-lock.json
      - name: Commit repaired lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile changes required.'
          else
            git commit -m 'fix(lockfile): record Linux Rollup optional packages [skip ci]'
            git push
          fi
