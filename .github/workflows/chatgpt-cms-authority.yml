name: chatgpt-cms-authority

on:
  push:
    branches: [nexgen-gate1-productization]
    paths: [.github/workflows/chatgpt-cms-authority.yml]

permissions:
  contents: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexgen-gate1-productization
      - name: Formalize MODULE:CMS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/04_MODULE_ARCHITECTURE.md')
          s = p.read_text()
          s = s.replace('| **Version** | 1.5 |', '| **Version** | 1.6 |', 1)
          s = s.replace('| **Last Updated** | 2026-08-08 |', '| **Last Updated** | 2026-09-07 |', 1)
          marker = '| 1.5 | 2026-08-08 | Formally added `MODULE:SEARCH`'
          idx = s.find(marker)
          if idx < 0:
              raise SystemExit('v1.5 changelog row not found')
          end = s.find('\n', idx)
          row = '| 1.6 | 2026-09-07 | Formally added `MODULE:CMS` (§4, Platform domain), following the accepted CMS Foundation content model and the Product Owner\'s explicit production-completion authorization. CMS owns merchant-authored storefront Pages, Menus/Navigation, reusable Snippets, revisions, and their draft/publish lifecycle; it references Media and Localization through Platform public contracts and Catalog entities by identifier only. Classified Experimental under §8 for its first implementation. | neXgen V1 requires merchant-managed homepage/content/policy/navigation surfaces; `MODULE:AUTHORITY` requires this boundary to be accepted before persistence/API implementation begins. |'
          s = s[:end+1] + row + '\n' + s[end+1:]
          media = '- **Media** (`MODULE:MEDIA`) — owns uploaded assets (images and other files) referenced by other modules; other modules reference media by identifier, never by direct storage access.\n'
          cms = '- **CMS** (`MODULE:CMS`) — owns merchant-authored storefront Pages, Menus/Navigation, reusable content Snippets, revision history, and their draft/publish lifecycle. Depends only on Platform public contracts (Media for asset references, Localization & Currency for locale identity, Identity & Access for authorship/permissions). Catalog/Product/Category targets are stored by identifier and resolved by Storefront/Gateway consumers; CMS never reads Commerce-owned data directly.\n'
          if cms not in s:
              s = s.replace(media, media + cms, 1)
          old = '`Reporting`, `CRM`, `Marketing`, `Automation`, and `Extensibility` are Experimental'
          new = '`Reporting`, `CRM`, `Marketing`, `Automation`, `CMS`, and `Extensibility` are Experimental'
          if old not in s:
              raise SystemExit('experimental classification marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git rm .github/workflows/chatgpt-cms-authority.yml
          git config user.name "Md Zahedul Hasan"
          git config user.email "afzatube@gmail.com"
          git add docs/04_MODULE_ARCHITECTURE.md
          git commit -m "docs: formally authorize MODULE:CMS"
          git push origin HEAD:nexgen-gate1-productization
