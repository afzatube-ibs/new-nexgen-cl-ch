name: gate4-postcss-lock-refresh

on:
  push:
    branches:
      - nexgen-gate4-security-hardening
    paths:
      - '.github/workflows/gate4-postcss-lock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Gate 4 branch
        uses: actions/checkout@v4
        with:
          ref: nexgen-gate4-security-hardening
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate npm lock with npm 11
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npx --yes npm@11 install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify runtime npm 10 clean install and patched PostCSS
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm --version | cut -d. -f1)" = "10"
          npm ci --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const lock = require('./package-lock.json');
          const nested = lock.packages?.['node_modules/next/node_modules/postcss'];
          const root = lock.packages?.['node_modules/postcss'];
          const versions = [nested?.version, root?.version].filter(Boolean);
          if (!versions.length) throw new Error('PostCSS missing from lock');
          for (const version of versions) {
            const [major, minor, patch] = version.split('.').map(Number);
            if (major < 8 || (major === 8 && (minor < 5 || (minor === 5 && patch < 23)))) {
              throw new Error(`Vulnerable PostCSS remains in lock: ${version}`);
            }
          }
          console.log(`PostCSS instances: ${versions.join(', ')}`);
          NODE

      - name: Commit refreshed npm lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'security(deps): lock patched PostCSS override'
          git push origin HEAD:nexgen-gate4-security-hardening
