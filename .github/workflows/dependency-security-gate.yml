name: dependency-security-gate

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**/package.json'
      - 'packages/**/package.json'
      - 'apps/backend/composer.json'
      - 'apps/backend/composer.lock'
      - '.github/workflows/dependency-security-audit.yml'
      - '.github/workflows/dependency-security-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Clean Node install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Enforce zero npm advisories
        run: npm audit --audit-level=info

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        working-directory: apps/backend
        run: composer install --no-interaction --prefer-dist --no-progress --no-audit

      - name: Enforce zero Composer advisories
        working-directory: apps/backend
        run: composer audit --locked
