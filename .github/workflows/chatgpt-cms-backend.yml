name: chatgpt-cms-backend

on:
  push:
    branches: [nexgen-gate1-productization]
    paths: [.github/workflows/chatgpt-cms-backend.yml]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
