name: dependency-security-audit

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**/package.json'
      - 'packages/**/package.json'
      - 'apps/backend/composer.json'
      - 'apps/backend/composer.lock'
      - '.github/workflows/dependency-security-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Clean Node install
        run: npm ci --ignore-scripts

      - name: Capture npm audit
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/nexgen-security-audit"
          npm audit --json > "$RUNNER_TEMP/nexgen-security-audit/npm-audit.json" || true

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        working-directory: apps/backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Capture Composer audit
        working-directory: apps/backend
        shell: bash
        run: |
          set -uo pipefail
          composer audit --format=json > "$RUNNER_TEMP/nexgen-security-audit/composer-audit.json" || true

      - name: Build sanitized audit summary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = `${process.env.RUNNER_TEMP}/nexgen-security-audit/npm-audit.json`;
          const out = `${process.env.RUNNER_TEMP}/nexgen-security-audit/npm-summary.md`;
          let audit = {};
          try { audit = JSON.parse(fs.readFileSync(path, 'utf8')); } catch {}
          const counts = audit?.metadata?.vulnerabilities || {};
          const vulns = audit?.vulnerabilities || {};
          const rows = Object.entries(vulns)
            .map(([name, v]) => ({
              name,
              severity: v.severity || 'unknown',
              direct: Boolean(v.isDirect),
              fix: v.fixAvailable === true ? 'yes' : (v.fixAvailable ? 'upgrade' : 'no'),
            }))
            .sort((a, b) => ['critical','high','moderate','low','info','unknown'].indexOf(a.severity) - ['critical','high','moderate','low','info','unknown'].indexOf(b.severity));
          let md = '# npm audit\n\n';
          md += `Counts: critical=${counts.critical || 0}, high=${counts.high || 0}, moderate=${counts.moderate || 0}, low=${counts.low || 0}, total=${counts.total || 0}\n\n`;
          if (rows.length) {
            md += '| Package | Severity | Direct | Fix available |\n|---|---|---:|---|\n';
            for (const r of rows) md += `| ${r.name} | ${r.severity} | ${r.direct ? 'yes' : 'no'} | ${r.fix} |\n`;
          } else {
            md += 'No npm advisories reported.\n';
          }
          fs.writeFileSync(out, md);
          NODE

          python3 <<'PY'
          import json, os
          base = os.path.join(os.environ['RUNNER_TEMP'], 'nexgen-security-audit')
          src = os.path.join(base, 'composer-audit.json')
          out = os.path.join(base, 'composer-summary.md')
          try:
              with open(src, encoding='utf-8') as f:
                  data = json.load(f)
          except Exception:
              data = {}
          advisories = data.get('advisories', {}) or {}
          rows = []
          for package, items in advisories.items():
              for item in items or []:
                  rows.append((package, item.get('advisoryId') or item.get('cve') or 'advisory', item.get('title') or 'Security advisory'))
          lines = ['# Composer audit', '', f'Advisories: {len(rows)}', '']
          if rows:
              lines += ['| Package | Advisory | Title |', '|---|---|---|']
              for package, advisory, title in rows:
                  title = str(title).replace('|', '\\|').replace('\n', ' ')
                  lines.append(f'| {package} | {advisory} | {title} |')
          else:
              lines.append('No Composer advisories reported.')
          with open(out, 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          PY

          cat "$RUNNER_TEMP/nexgen-security-audit/npm-summary.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/nexgen-security-audit/composer-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dependency audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: nexgen-dependency-security-audit-${{ github.sha }}
          path: ${{ runner.temp }}/nexgen-security-audit
          if-no-files-found: error
          retention-days: 14
