# neXgen Core — Application Unit web front.
#
# nginx terminates HTTP and hands PHP requests to the `app` container's
# php-fpm over the internal network — the standard, boring, maintainable
# pairing for a self-hosted PHP/Laravel deployment (ADR-0002, ADR-0008),
# deliberately preferred over an embedded application server so the web
# tier and the application runtime can be reasoned about, scaled, and
# replaced independently.

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    # SECURITY:SECURE_CONFIGURATION — do not advertise the web server
    # implementation/version by default.
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60;
    }

    # Never serve dotfiles (.env, .git, etc.) — defense in depth alongside
    # keeping them out of the image entirely (see .dockerignore).
    location ~ /\. {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
